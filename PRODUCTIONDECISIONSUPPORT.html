<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI-Recommendation</title>
<style>  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {    background: transparent;    margin: 0;    padding: 0;    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;    -webkit-font-smoothing: antialiased;    text-rendering: optimizeLegibility;  }
  .ai-card {    position: relative;    width: 100%;    padding: 11px 40px 12px;    border-radius: 0;    overflow: hidden;    color: #2B3242;    background: linear-gradient(135deg, #F5F7FA 0%, #EDF0F5 48%, #F5F7FA 100%);    box-shadow:      0 10px 26px -14px rgba(30, 40, 70, 0.18),      0 2px 8px -3px rgba(0, 0, 0, 0.08),      inset 0 1px 0 rgba(255, 255, 255, 0.6);    border: 1px solid rgba(120, 130, 160, 0.20);  }
  .ai-card::before {    content: "";    position: absolute;    top: -160px;    right: -110px;    width: 460px;    height: 460px;    background: radial-gradient(circle at center,      rgba(91, 107, 214, 0.10) 0%,      rgba(91, 107, 214, 0.04) 38%,      rgba(91, 107, 214, 0) 70%);    pointer-events: none;  }
  .ai-card > * { position: relative; z-index: 1; }
  .ai-header {    display: flex;    align-items: center;    gap: 14px;    margin-bottom: 8px;  }
  .sparkle {    font-size: 24px;    line-height: 1;    filter: drop-shadow(0 0 4px rgba(91, 107, 214, 0.35));    animation: sparklePulse 2.4s ease-in-out infinite;    transform-origin: center;  }
  @keyframes sparklePulse {    0%, 100% { transform: scale(1) rotate(0deg);   opacity: 0.9; }    50%      { transform: scale(1.18) rotate(8deg); opacity: 1;   }  }
  .ai-title {    font-size: 30px;    font-weight: 800;    letter-spacing: 0.3px;    margin: 0;    color: #1E2536;  }
  .generated-badge {    margin-left: auto;    display: inline-flex;    align-items: center;    gap: 8px;    padding: 6px 14px;    font-size: 12px;    font-weight: 600;    letter-spacing: 0.4px;    text-transform: uppercase;    color: #1F8A5C;    border-radius: 999px;    background: rgba(31, 138, 92, 0.08);    border: 1px solid rgba(31, 138, 92, 0.30);  }
  .generated-badge .dot {    width: 8px;    height: 8px;    border-radius: 50%;    background: #2FAE73;    box-shadow: 0 0 5px 1px rgba(47, 174, 115, 0.6);    animation: livePulse 1.8s ease-in-out infinite;  }
  @keyframes livePulse {    0%, 100% { opacity: 1;   transform: scale(1);   }    50%      { opacity: 0.4; transform: scale(0.75); }  }
  .rec-line {    display: flex;    align-items: center;    flex-wrap: nowrap;    gap: 16px;    font-size: 16px;    color: #4B5468;  }
  .rec-note { flex: 0 1 auto; }
  .score-pill {    display: inline-flex;    align-items: center;    padding: 5px 16px;    font-weight: 700;    font-size: 17px;    color: #FFFFFF;    border-radius: 999px;    white-space: nowrap;    background: linear-gradient(90deg, #5B6BD6 0%, #4C5BC0 100%);    box-shadow:      0 0 8px -1px rgba(91, 107, 214, 0.35),      inset 0 1px 0 rgba(255, 255, 255, 0.20);  }
  .score-pill .chev {    margin-right: 6px;    letter-spacing: -2px;    opacity: 0.9;  }
  .rec-note b { color: #1E2536; font-weight: 700; }
  .chips {    display: flex;    align-items: stretch;    gap: 14px;    margin-left: auto;  }
  .chip {    display: flex;    align-items: center;    gap: 12px;    padding: 6px 16px;    border-radius: 0;    background: rgba(255, 255, 255, 0.65);    border: 1px solid rgba(120, 130, 160, 0.16);    border-left-width: 4px;  }
  .chip.accent-1 { border-left-color: #2FAE73; }  .chip.accent-2 { border-left-color: #4A90D9; }
  .chip-icon {    flex: 0 0 auto;    width: 40px;    height: 40px;    display: flex;    align-items: center;    justify-content: center;    font-size: 32px;    line-height: 1;    background: transparent;  }
  .chip-label {    font-size: 11.5px;    font-weight: 700;    letter-spacing: 0.5px;    text-transform: uppercase;    color: #8890A2;  }
  .chip-value {    font-size: 18px;    font-weight: 700;    color: #1E2536;  }</style></head><body>
  <div class="ai-card">
    <div class="ai-header">      <span class="sparkle">✨</span>       <b class="ai-title">AI-Recommendation</b>      <span class="generated-badge"><span class="dot"></span>AI Generated</span>    </div>
    <div class="rec-line">      <span class="score-pill"><span class="chev">▶▶</span>Make In-House</span>      <span class="rec-note">Idle capacity, internal cost <b>45% below</b> buy price</span>
      <div class="chips">        <div class="chip accent-1">          <span class="chip-icon">💰</span>          <span>            <span class="chip-label">Est. Cost Advantage</span><br>            <span class="chip-value">91 €/pc</span>          </span>        </div>        <div class="chip accent-2">          <span class="chip-icon">📈</span>          <span>            <span class="chip-label">Est. Annual Saving</span><br>            <span class="chip-value">54.460 €/yr</span>          </span>        </div>      </div>    </div>
  </div>
</body></html>
